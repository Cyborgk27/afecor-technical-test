<div class="p-4">
    <h2 class="text-xl font-bold mb-4">📋 Lista de Pedidos</h2>

    <div class="overflow-x-auto rounded-2xl shadow-lg">
        <table mat-table [dataSource]="dataSource" class="min-w-full bg-white">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">ID</th>
                <td mat-cell *matCellDef="let order" class="px-4 py-2">
                    {{ order.id }}
                </td>
            </ng-container>

            <!-- Cliente -->
            <ng-container matColumnDef="clientId">
                <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Cliente</th>
                <td mat-cell *matCellDef="let order" class="px-4 py-2">
                    {{ order.clientId }}
                </td>
            </ng-container>

            <!-- Fecha -->
            <ng-container matColumnDef="orderDate">
                <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Fecha</th>
                <td mat-cell *matCellDef="let order" class="px-4 py-2">
                    {{ order.orderDate | date:'short' }}
                </td>
            </ng-container>

            <!-- Total -->
            <ng-container matColumnDef="total">
                <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Total</th>
                <td mat-cell *matCellDef="let order" class="px-4 py-2">
                    $ {{ order.total | number:'1.2-2' }}
                </td>
            </ng-container>

            <!-- Acciones -->
            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-center">Acciones</th>
                <td mat-cell *matCellDef="let order" class="px-4 py-2 flex justify-center gap-2">
                    <button mat-button color="primary" (click)="editOrder(order)">✏️ Editar</button>
                    <button mat-button color="warn" (click)="deleteOrder(order)">🗑️ Eliminar</button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-100"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50"></tr>
        </table>
    </div>
</div>
